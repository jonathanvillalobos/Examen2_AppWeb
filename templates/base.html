<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portal de Servicios: información empresarial y herramientas prácticas.">
    <title>{{ titulo }} | Portal de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
          crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Portal de Servicios</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Abrir menú de navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'index' %} active{% endif %}"
                           {% if request.endpoint == 'index' %}aria-current="page"{% endif %}
                           href="{{ url_for('index') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'compra' %} active{% endif %}"
                           {% if request.endpoint == 'compra' %}aria-current="page"{% endif %}
                           href="{{ url_for('compra') }}">Compra</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'salario' %} active{% endif %}"
                           {% if request.endpoint == 'salario' %}aria-current="page"{% endif %}
                           href="{{ url_for('salario') }}">Salario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'temperatura' %} active{% endif %}"
                           {% if request.endpoint == 'temperatura' %}aria-current="page"{% endif %}
                           href="{{ url_for('temperatura') }}">Temperatura</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'empresa' %} active{% endif %}"
                           {% if request.endpoint == 'empresa' %}aria-current="page"{% endif %}
                           href="{{ url_for('empresa') }}">Empresa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'servicios' %} active{% endif %}"
                           {% if request.endpoint == 'servicios' %}aria-current="page"{% endif %}
                           href="{{ url_for('servicios') }}">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'contacto' %} active{% endif %}"
                           {% if request.endpoint == 'contacto' %}aria-current="page"{% endif %}
                           href="{{ url_for('contacto') }}">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-lg-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-top py-3">
        <div class="container text-center text-muted small">
            Portal de Servicios · Información y herramientas para tu día a día
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"></script>
</body>
</html>
